services:
  postgres:
    build:
      context: ./services/postgres
    container_name: azureus-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-azureus}
      POSTGRES_USER: ${POSTGRES_USER:-azureus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-azureus} -d ${POSTGRES_DB:-azureus}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: azureus-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mlflow:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: azureus-mlflow
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql+psycopg://${POSTGRES_USER:-azureus}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${MLFLOW_POSTGRES_DB:-mlflow}
      MLFLOW_ARTIFACT_ROOT: ${MLFLOW_ARTIFACT_ROOT:-/var/azureus/mlflow_artifacts}
    command:
      [
        "sh",
        "-c",
        "mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri \"$${MLFLOW_BACKEND_STORE_URI}\" --default-artifact-root \"$${MLFLOW_ARTIFACT_ROOT}\"",
      ]
    ports:
      - "5000:5000"
    volumes:
      - mlflow_artifacts:/var/azureus/mlflow_artifacts
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  mlflow_artifacts:
