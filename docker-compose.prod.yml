services:
  postgres:
    build:
      context: ./services/postgres
    image: azureus-postgres:prod
    env_file:
      - .env.prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        GIT_STATUS_CLEAN: ${GIT_STATUS_CLEAN:-false}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    image: azureus-api:prod
    env_file:
      - .env.prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5).read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  worker:
    image: azureus-worker:prod
    build:
      context: .
      dockerfile: services/api/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        GIT_STATUS_CLEAN: ${GIT_STATUS_CLEAN:-false}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    env_file:
      - .env.prod
    command: ["rq", "worker", "backtests", "--url", "redis://redis:6379/0"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    env_file:
      - .env.prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./services/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend/dist:/srv/frontend:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
